:root{--ink:#183d64;--gold:#edb449;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:#17304c;background:var(--bg);font-size:16px;line-height:1.65}button,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}header{background:var(--ink);color:white;padding:26px 20px 20px}header>div,main{max-width:960px;margin:auto}h1{font-size:28px;line-height:1.3;margin:5px 0 10px}h2{font-size:23px;margin:0 0 12px}h3{margin:0;font-size:20px}.eyebrow{color:#f7d88e;font-weight:700;font-size:14px}.meta{font-size:14px;opacity:.88}.progress{height:8px;border-radius:9px;background:#ffffff30;margin-top:16px;overflow:hidden}.progress span{display:block;height:100%;background:var(--gold);transition:width .3s}nav{display:flex;gap:8px;padding:14px 0;flex-wrap:wrap}button{border:1px solid #c9d5e2;background:white;color:var(--ink);border-radius:12px;padding:11px 16px;font-weight:650}button.active,.primary{background:var(--ink);color:white;border-color:var(--ink)}main{padding:0 18px 40px}.days{display:flex;gap:8px;margin:5px 0 20px}.days button{flex:1;padding:12px 5px}article,.panel{background:white;border:1px solid #dce4ed;border-radius:18px;padding:22px;margin-bottom:15px;box-shadow:0 5px 15px #183d6405}.spot-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.small{font-size:14px;color:#566a80}.badge{font-size:14px;background:#eaf0f7;padding:4px 10px;border-radius:20px;white-space:nowrap}.done{background:#d6f0e4;color:#195640}.question{font-size:20px;font-weight:700;line-height:1.6;margin:16px 0}.step{border-left:3px solid var(--gold);padding-left:14px;margin:16px 0}.step strong{display:block}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}textarea{width:100%;min-height:104px;border:1px solid #b9c8d8;border-radius:12px;padding:12px;background:#fbfcfe;color:#17304c}details{background:#edf3fa;border-radius:12px;padding:12px 15px;margin-top:14px}summary{cursor:pointer;font-weight:65 </style></head><body><header><div><div class="eyebrow">2026.10.03 — 10.05 · 초3 가족 탐험</div><h1>경주 탐험 수첩</h1><div class="meta">용인 수지 출발 · 한옥녹턴 율동점 · 자가용</div><div class="progress" aria-label="미션 진행률"><span id="bar"></span></div><div id="count" class="meta"></div></div></header><main><nav aria-label="주 메뉴"><button class="active" data-view="mission">관찰 미션</button><button data-view="schedule">우리 일정</button><button data-view="quiz">생각 확인</button><button data-view="journal">탐험 기록</button></nav><section id="mission"><div class="days"><button data-day="0" class="active">3일 · 무덤과 별</button><button data-day="1">4일 · 신라의 기술</button><button data-day="2">5일 · 한옥과 정리</button></div><div id="spots"></div></section><section id="schedule" class="hidden"></section><section id="quiz" class="hidden"></section><section id="journal" class="hidden"></section><footer>기록은 이 기기의 브라우저에 저장돼요. 다른 기기와 공유되지 않으며, 브라우저 데이터를 지우면 사라질 수 있어요. 중요한 기록은 ‘기록 내려받기’로 보관하세요.<br>시설 정보 확인: 2026.10.01 · 이동 시간은 계획용이며 교통·주차 상황에 따라 달라져요.</footer></main><script>
const places=[
{id:'tomb',day:0,name:'대릉원 · 천마총',time:'13:30 · 약 70분',icon:'🔎',q:'무덤 속 물건은 어떤 이야기를 들려줄까?',observe:'천마총 안에서 장신구나 생활용품을 찾아요. 실제 유물과 복제품·재현 전시인지 설명판도 확인해요.',think:'물건 하나를 골라 누가, 언제, 어떻게 썼을지 추측해 보세요.',hint:'무덤에는 죽은 사람과 함께 물건을 넣기도 했어요. 연구자들은 무덤의 구조와 물건을 살펴 당시 생활과 기술을 알아내요. 물건만으로 무덤 주인의 이름까지 확실히 알 수 있는 것은 아니에요.',parent:'“왕의 무덤이야”로 끝내기보다 “그렇게 생각한 근거는 무엇일까?”라고 물어보세요. 천마총은 주인이 확정되지 않은 무덤입니다.',prompt:'내가 고른 물건과 그렇게 생각한 이유',map:'경주 천마총'},
{id:'stars',day:0,name:'첨성대',time:'18:00 · 약 40분',icon:'✨',q:'옛사람들은 왜 하늘을 살펴봤을까?',observe:'아래 받침, 둥근 몸통, 위쪽 모양을 찾아요. 친구에게 말로 설명할 수 있게 자세히 보세요.',think:'달력과 휴대폰이 없다면 계절을 어떻게 알 수 있을까요?',hint:'첨성대는 신라 선덕여왕 때 세운 천문 관측 관련 유적으로 알려져 있어요. 하늘의 변화는 계절과 농사 시기를 이해하는 데 중요했어요. 구체적인 사용 방법에는 여러 연구가 있어요.',parent:'돌 개수와 상징의 해석을 확정된 사실처럼 외우게 하지 마세요. 보이는 구조와 관찰의 목적을 연결하면 충분합니다.',prompt:'첨성대에서 직접 발견한 모양',map:'경주 첨성대'},
{id:'temple',day:1,name:'불국사',time:'09:00 · 약 90분',icon:'🏛️',q:'두 돌탑은 어떻게 다를까?',observe:'다보탑과 석가탑을 비교해요. 층, 계단, 장식, 전체 모양 중 다른 점 세 가지를 찾아요.',think:'내가 만들고 싶은 탑은 어느 쪽인가요? 모양을 근거로 이유를 말해 보세요.',hint:'두 탑은 같은 절 안에서도 서로 다른 아름다움을 보여줘요. 석가탑은 비교적 단순하고 균형 잡힌 모습, 다보탑은 복잡하고 다양한 구조가 눈에 띄어요. 불국사와 석굴암은 유네스코 세계유산이에요.',parent:'탑 이름을 맞히는 것보다 아이가 차이를 직접 찾아 설명하게 하세요. 돌과 돌 사이, 반복되는 모양도 함께 보세요.',prompt:'두 탑의 다른 점 세 가지',map:'경주 불국사'},
{id:'museum',day:1,name:'국립경주박물관',time:'12:00 · 약 100분',icon:'🏺',q:'옛날 물건과 우리 집 물건은 닮았을까?',observe:'신라역사관에서 장신구 하나, 생활용품 하나, 용도를 모르는 물건 하나를 골라요. 전시 중인 물건으로 활동하면 돼요.',think:'설명판을 보기 전에 용도를 추측해요. 설명을 읽은 뒤 생각이 어떻게 달라졌나요?',hint:'유물은 옛사람이 남긴 물건이에요. 재료, 모양, 발견 장소를 함께 살펴야 더 잘 이해할 수 있어요. 추측과 설명판에서 확인한 사실을 나눠 적어 보세요.',parent:'전시실 전체를 다 보려 하지 말고 유물 세 개에 집중하세요. 성덕대왕신종의 에밀레 이야기는 전설과 확인된 역사를 구분해 주세요.',prompt:'내 추측 / 설명판에서 확인한 사실',map:'국립경주박물관'},
{id:'pond',day:1,name:'동궁과 월지',time:'18:00 · 체력에 따라 선택',icon:'🌙',q:'왕궁에 연못을 만든 이유는 무엇일까?',observe:'연못 모양, 건물 위치, 물에 비친 모습을 찾아요. 박물관 월지관에서 본 물건도 떠올려요.',think:'이곳에서 사람들이 무엇을 했을지 상상해 보세요. 직접 본 것과 상상한 것을 구분해요.',hint:'동궁과 월지는 신라 왕궁과 관련된 유적이에요. 이곳에서 발견된 물건은 당시 왕실 생활을 알려줘요. 현재 보이는 전각은 옛 건물이 그대로 남은 것이 아니라 복원된 건물이에요.',parent:'야경 감상도 활동입니다. 아이가 피곤하면 생략하세요. 복원된 건물과 유적의 흔적을 구분해 이야기하면 좋아요.',prompt:'직접 본 것 하나 / 상상한 장면 하나',map:'경주 동궁과 월지'},
{id:'hanok',day:2,name:'한옥녹턴 · 한옥 관찰',time:'아침 · 약 20분',icon:'🏡',q:'한옥은 우리 집과 어떻게 다를까?',observe:'실제 보이는 기와, 처마, 마루, 문을 살펴요. 보이지 않는 구조는 억지로 찾지 않아도 돼요.',think:'좋았던 점 하나와 불편했던 점 하나를 찾아요. 내가 집을 만든다면 무엇을 가져오고 싶나요?',hint:'한옥은 전통적인 방식과 재료를 바탕으로 지은 집이에요. 오늘날 숙소로 쓰는 한옥에는 현대적인 설비도 함께 있어요. 이 숙소의 모습이 모든 한옥과 같지는 않아요.',parent:'온돌이나 마루의 원리는 실제 구조를 확인할 수 있을 때 설명하세요. 숙소 물건을 만지거나 문을 열기 전 이용 안내를 확인하세요.',prompt:'우리 집과 다른 점 / 내가 가져오고 싶은 특징',map:'한옥녹턴 율동점'}];
const schedules=[[['06:30','수지구 출발 · 휴게소에서 아침과 휴식'],['12:00','경주 도착 목표 · 점심'],['13:30','대릉원·천마총'],['14:40','황리단길 간식 · 숙소 이동'],['15:30','예약 시간에 맞춰 체크인 · 휴식'],['17:00','시내로 이동 · 저녁'],['18:00','첨성대·계림 산책'],['19:30','숙소 · 기록 10분']], [['08:00','아침 · 불국사로 이동'],['09:00','불국사 · 두 탑 비교'],['10:30','간식·점심 · 박물관 이동'],['12:00','국립경주박물관'],['14:00','숙소 휴식 · 자유 놀이'],['16:30','시내로 이동 · 저녁'],['18:00','동궁과 월지 · 선택'],['19:30','숙소 복귀']], [['08:00','아침 · 한옥 관찰'],['09:00','짐 정리 · 여행 이야기'],['예약 기준','체크아웃'],['11:00','이른 점심'],['12:00','수지구로 출발 · 휴게소 휴식']]];
const qs=[{q:'유물의 용도를 알아보는 좋은 방법은?',a:['모양만 보고 무조건 정하기','먼저 추측하고 설명판과 비교하기','반짝이는 물건만 보기'],right:1,why:'생각을 먼저 세우고 근거와 비교하면, 추측이 사실인지 확인할 수 있어요.'},{q:'천마총의 주인에 대한 설명으로 알맞은 것은?',a:['이름이 확실히 알려져 있어요','아직 주인이 확정되지 않았어요','아무 물건도 나오지 않았어요'],right:1,why:'주인의 이름은 확정되지 않았어요. 모르는 것은 모른다고 말하는 것도 역사 공부예요.'},{q:'동궁과 월지에서 지금 보이는 전각은?',a:['옛 건물이 그대로 남아 있어요','복원된 건물이에요','신라와 관계없는 놀이시설이에요'],right:1,why:'옛 모습을 이해하도록 복원한 건물이에요. 남아 있는 흔적과 복원을 구분해 보세요.'},{q:'두 탑을 비교할 때 가장 도움이 되는 말은?',a:['다보탑은 계단과 장식이 더 복잡해 보여요','그냥 달라요','큰 탑이 무조건 더 좋아요'],right:0,why:'직접 관찰한 특징을 근거로 말하면 다른 사람도 내 생각을 이해할 수 있어요.'}];
let state={notes:{},done:{},answers:{},wrap:''},day=0,view='mission';try{state={...state,...JSON.parse(localStorage.getItem('gyeongju-notebook-v1')||'{}')}}catch{}let storageOK=true;function save(){try{localStorage.setItem('gyeongju-notebook-v1',JSON.stringify(state));return true}catch{storageOK=false;return false}}function el(t){const x=document.createElement('template');x.innerHTML=t;return x.content}function esc(t){return String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function progress(){const n=places.filter(p=>state.done[p.id]).length;document.getElementById('bar').style.width=n/places.length*100+'%';document.getElementById('count').textContent=`관찰 미션 ${n} / ${places.length} · 선택 미션은 건너뛰어도 괜찮아요`}
function missions(){document.getElementById('spots').innerHTML=places.filter(p=>p.day===day).map(p=>`<article><div class="spot-top"><h3>${p.icon} ${p.name}</h3><span class="badge ${state.done[p.id]?'done':''}">${state.done[p.id]?'관찰 완료':'탐험 미션'}</span></div><div class="small">${p.time}</div><div class="question">${p.q}</div><div class="step"><strong>1. 눈으로 찾아요</strong>${p.observe}</div><div class="step"><strong>2. 내 생각을 말해요</strong>${p.think}</div><label for="note-${p.id}" class="small">${p.prompt}</label><textarea id="note-${p.id}" data-note="${p.id}" placeholder="짧은 단어나 한 문장도 좋아요.">${esc(state.notes[p.id])}</textarea><div class="saved" id="saved-${p.id}" aria-live="polite"></div><details><summary>3. 관찰한 뒤 설명 보기</summary><p>${p.hint}</p></details><details><summary>부모님 읽어주기</summary><p>${p.parent}</p></details><div class="actions"><button class="primary" data-done="${p.id}">${state.done[p.id]?'완료 취소':'관찰 완료하기'}</button><a href="https://map.kakao.com/?q=${encodeURIComponent(p.map)}" target="_blank" rel="noopener">지도 열기</a></div></article>`).join('');progress()}
function schedule(){document.getElementById('schedule').innerHTML=`<div class="note">첫날 도착이 14시 이후면 천마총을 5일 오전으로 옮겨요. 둘째 날 피곤하면 동궁과 월지는 생략해요. 체크인·체크아웃과 주차는 숙소 예약 안내를 확인하세요.</div>`+schedules.map((rows,i)=>`<article style="margin-top:16px"><h2>10월 ${i+3}일 · ${['토요일','일요일','월요일'][i]}</h2>${rows.map(r=>`<div class="timeline"><time>${r[0]}</time><span>${r[1]}</span></div>`).join('')}</article>`).join('')+`<article><h3>방문 전 확인</h3><p>국립경주박물관: 기본 10:00~18:00. 10/3~5 전시해설 미운영. 어린이박물관은 현재 임시 휴관 안내가 유지돼요.</p><p>불국사: 한국관광공사 안내 기준 09:00~18:00, 무료. 운영 변경은 출발 전 확인하세요.</p><a href="https://gyeongju.museum.go.kr/" target="_blank" rel="noopener">국립경주박물관 공식 안내</a> · <a href="https://www.bulguksa.or.kr/" target="_blank" rel="noopener">불국사 공식 안내</a><p class="small">석굴암은 기본 일정에서 제외했어요. 비가 오면 박물관을 먼저 방문하고 야외 코스를 줄이세요.</p></article>`}
function quiz(){document.getElementById('quiz').innerHTML='<div class="panel"><h2>탐험 후 생각 확인</h2><p>틀려도 괜찮아요. 이유를 읽고 다시 생각해 보세요.</p></div>'+qs.map((q,i)=>`<article><h3>${i+1}. ${q.q}</h3>${q.a.map((a,j)=>`<button class="quizopt ${state.answers[i]===j?'active':''}" data-quiz="${i}" data-answer="${j}">${a}</button>`).join('')}${state.answers[i]!==undefined?`<div class="feedback" role="status">${state.answers[i]===q.right?'잘 생각했어요!':'다시 생각해 볼까요?'} ${q.why}</div>`:''}</article>`).join('')}
function journal(){document.getElementById('journal').innerHTML=`<div class="panel"><h2>내가 발견한 신라</h2><p>기억나는 장소와 근거를 연결해 봐요.</p><label for="wrap">가장 기억나는 장소 / 직접 본 것 / 새로 알게 된 것 / 더 궁금한 것</label><textarea id="wrap" style="min-height:160px" placeholder="여행을 마치며 네 가지를 적어 보세요.">${esc(state.wrap)}</textarea><div id="wrap-saved" class="saved" aria-live="polite"></div><div class="actions"><button id="download" class="primary">기록 내려받기</button><button id="print">인쇄·PDF 저장</button></div></div>${places.map(p=>`<article class="summary-card"><h3>${p.name}</h3><div class="small">${state.done[p.id]?'관찰 완료':'아직 관찰 전'}</div><p style="white-space:pre-wrap">${esc(state.notes[p.id]||'아직 기록이 없어요.')}</p></article>`).join('')}`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));['mission','schedule','quiz','journal'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==view));if(view==='journal')journal();if(view==='quiz')quiz()}if(b.dataset.day!==undefined){day=Number(b.dataset.day);document.querySelectorAll('[data-day]').forEach(x=>x.classList.toggle('active',x===b));missions()}if(b.dataset.done){state.done[b.dataset.done]=!state.done[b.dataset.done];save();missions()}if(b.dataset.quiz!==undefined){state.answers[b.dataset.quiz]=Number(b.dataset.answer);save();quiz()}if(b.id==='print')window.print();if(b.id==='download'){const text='경주 탐험 수첩\n2026.10.03~05 · 한옥녹턴 율동점\n\n'+places.map(p=>p.name+'\n'+(state.notes[p.id]||'기록 없음')).join('\n\n')+'\n\n여행 정리\n'+state.wrap;const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='경주-탐험기록.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});document.addEventListener('input',e=>{if(e.target.dataset.note){const id=e.target.dataset.note;state.notes[id]=e.target.value;const ok=save();document.getElementById('saved-'+id).textContent=ok?'기록 저장됨':'저장 공간을 사용할 수 없어요. 기록을 내려받아 주세요.'}if(e.target.id==='wrap'){state.wrap=e.target.value;document.getElementById('wrap-saved').textContent=save()?'기록 저장됨':'저장하지 못했어요. 기록을 내려받아 주세요.'}});missions();schedule();quiz();journal();
</script></body></html>
